OpenAI:
  ApiKey: "" #本地不需要apikey
  BaseURL: "http://localhost:11434/v1" #ollama本地默认地址
  Model: "deepseek-r1:7b" #本地模型
  EmbeddingModel: "nomic-embed-text"

  MaxTokens: 512  # 最大token数
  Temperature: 0.7  # 温度参数,取值范围0-2,越高越随机
  TopP: 0.9 # 核心采样(0-1,越高越多样)
  PresencePenalty: 0.7  # 存在惩罚(-2.0,到2.0)
  FrequencyPenalty: 0.8 # 频率惩罚(-2.0,到2.0)

  # 高级控制参数
  #  StopSequence: [ "\n","###" ] # 停止符

  #调试参数
  Seed: -1 # 随机数种子(-1=随机,42固定种子)

# 向量数据库配置
VectorDB:
  Host: "127.0.0.1"
  Port: 5432
  DBName: "ai"
  User: "root"
  Password: "123456"
  Table: "vector_store"
  MaxConn: 20
  EmbeddingModel: "nomic-embed-text"
#  EmbeddingModel: "text-embedding-v4"